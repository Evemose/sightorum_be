services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: rorm-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    command: valkey-server --appendonly yes
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./rorm-springai/src/main/python
      dockerfile: Dockerfile
    container_name: rorm-ml-service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=5444
      - DATABASE_DATABASE=mydatabase
      - DATABASE_USER=myuser
      - DATABASE_PASSWORD=mypassword
      - REDIS_URL=redis://host.docker.internal:6379
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ml-models:/app/trained_models

  restate-server:
    image: docker.io/restatedev/restate:1.6
    container_name: rorm-restate
    ports:
      - "9080:8080"   # ingress (remapped to avoid clash with Spring Boot 8080)
      - "9070:9070"   # admin
    volumes:
      - restate-data:/restate-data
    environment:
      - RESTATE_DEFAULT_RETRY_POLICY__INITIAL_INTERVAL=50ms
      - RESTATE_DEFAULT_RETRY_POLICY__MAX_ATTEMPTS=3
      - RESTATE_DEFAULT_RETRY_POLICY__MAX_INTERVAL=60s
      - RESTATE_DEFAULT_RETRY_POLICY__EXPONENTIATION_FACTOR=2.0
      - RESTATE_DEFAULT_RETRY_POLICY__ON_MAX_ATTEMPTS=pause
    depends_on:
      valkey:
        condition: service_healthy

volumes:
  valkey-data:
  ml-models:
  restate-data:
