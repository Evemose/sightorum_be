services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: rorm-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    command: valkey-server --appendonly yes --requirepass ${VALKEY_PASSWORD:-***REMOVED-VALKEY-PASSWORD***}
    healthcheck:
      test: [ "CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:***REMOVED-VALKEY-PASSWORD***}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  restate-server:
    image: docker.io/restatedev/restate:1.6
    container_name: rorm-restate
    ports:
      - "9080:8080"   # ingress (remapped to avoid clash with Spring Boot 8080)
      - "9070:9070"   # admin
    volumes:
      - restate-data:/restate-data
      - ./restate.toml:/restate.toml
    environment:
      - RESTATE_NODE_NAME=7be0fd38532d
      - RESTATE_CONFIG=/restate.toml

volumes:
  valkey-data:
  restate-data:
