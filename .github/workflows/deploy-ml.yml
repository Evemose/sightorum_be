name: Deploy ML Worker

on:
  push:
    branches: [ master ]

env:
  AWS_REGION: eu-central-1
  ECR_REPO: ml-worker
  ECS_CLUSTER: MlInfraStack-MlCluster87EBA3AE-k1zgJGFRBWkS    # from cdk output
  ECS_SERVICE: MlInfraStack-MlServiceAC8BC53F-R1WsD6iG3HoP    # from cdk output

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest"
          docker build -t $IMAGE -f rorm-springai/src/main/python/Dockerfile rorm-springai/src/main/python
          docker push $IMAGE

      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment
