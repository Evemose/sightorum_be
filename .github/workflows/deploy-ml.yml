name: Deploy ML Worker

on:
  push:
    branches: [ master ]

env:
  AWS_REGION: eu-central-1
  ECR_REPO: ml-worker-v2
  MLINFRA_CLUSTER_EU_CENTRAL_1: MlGlobalsStack-MlCluster87EBA3AE-ak89dYX1YaU0
  MLINFRA_SERVICE_EU_CENTRAL_1: MlGlobalsStack-MlServiceAC8BC53F-HntyJKD3jSRK
  MLINFRA_CLUSTER_EU_WEST_1: MlComputeCluster-eu-west-1
  MLINFRA_SERVICE_EU_WEST_1: MlComputeService-eu-west-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest"
          docker build -t $IMAGE -f rorm-springai/src/main/python/Dockerfile rorm-springai/src/main/python
          docker push $IMAGE

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        region: [ eu-central-1, eu-west-1 ]

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ matrix.region }}

      - name: Resolve cluster and service for region
        id: resolve
        run: |
          case "${{ matrix.region }}" in
            eu-central-1)
              echo "cluster=${{ env.MLINFRA_CLUSTER_EU_CENTRAL_1 }}" >> $GITHUB_OUTPUT
              echo "service=${{ env.MLINFRA_SERVICE_EU_CENTRAL_1 }}" >> $GITHUB_OUTPUT
              ;;
            eu-west-1)
              echo "cluster=${{ env.MLINFRA_CLUSTER_EU_WEST_1 }}" >> $GITHUB_OUTPUT
              echo "service=${{ env.MLINFRA_SERVICE_EU_WEST_1 }}" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster ${{ steps.resolve.outputs.cluster }} \
            --service ${{ steps.resolve.outputs.service }} \
            --force-new-deployment \
            --region ${{ matrix.region }}
