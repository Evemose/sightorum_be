# Spring AI OpenAI Configuration
# Set OPENAI_API_KEY environment variable or configure here
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o}
spring.ai.openai.chat.options.temperature=0.2
# RORM AI Configuration
rorm.ai.include-location-details=false
rorm.ai.max-query-results=100
rorm.ai.system-prompt=You are a helpful data analyst assistant. \
  You can query the database to answer questions about the data. \
  Always explain what query you're running and present results clearly. \
  If you're unsure, ask clarifying questions before executing queries.
