# Common validation messages
validation.notBlank=не повинно бути порожнім
validation.notNull=не повинно бути null
validation.notEmpty=не повинно бути порожнім
validation.size=розмір повинен бути від {min} до {max}
validation.min=повинно бути не менше {value}
validation.max=повинно бути не більше {value}
validation.positive=повинно бути додатним числом
validation.positiveOrZero=повинно бути нулем або додатним числом
validation.pattern=повинно відповідати шаблону "{regexp}"
# Chat validation
validation.chat.session.schemaName=назва схеми обов'язкова
validation.chat.message.text=текст повідомлення обов'язковий
validation.chat.correction.type=тип корекції обов'язковий
validation.chat.correction.message=повідомлення корекції обов'язкове
# Import validation
validation.import.tempFileId=ідентифікатор тимчасового файлу обов'язковий
validation.import.tempFileId.format=ідентифікатор повинен бути у форматі UUID
validation.import.targetSchema=назва цільової схеми обов'язкова
validation.import.targetSchema.pattern=назва схеми повинна містити лише літери, цифри та підкреслення
validation.import.chunkSize.min=розмір пакету повинен бути не менше {value}
validation.import.chunkSize.max=розмір пакету не повинен перевищувати {value}
validation.import.listSeparator=роздільник списку обов'язковий
validation.import.listSeparator.size=роздільник списку повинен бути від {min} до {max} символів
# Schema override validation
validation.override.attributeName=назва атрибуту обов'язкова
validation.override.dataType=тип даних обов'язковий
validation.override.dataType.invalid=невірний тип даних: допустимі TEXT, INTEGER, BIGINT, DECIMAL, BOOLEAN, DATE, TIME, TIMESTAMP
validation.override.columnName=назва колонки обов'язкова
validation.override.separator=роздільник обов'язковий для колекційних атрибутів
validation.override.targetRootName=назва цільового кореня обов'язкова для посилань
validation.override.subAttributeColumns=список колонок субатрибутів обов'язковий
validation.override.nestedOverrides=список вкладених перевизначень обов'язковий
# Metamodel validation
validation.metamodel.schemaName=назва схеми обов'язкова
validation.metamodel.rootName=назва кореня обов'язкова
# Data/Query validation
validation.query.required=запит обов'язковий
validation.query.limit.max=ліміт запиту не повинен перевищувати {value}
# File upload validation
validation.file.required=файл обов'язковий
validation.file.empty=завантажений файл порожній
validation.file.size.max=розмір файлу не повинен перевищувати {value}
validation.file.type.invalid=невірний тип файлу: підтримуються лише CSV файли
