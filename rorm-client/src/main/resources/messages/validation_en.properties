# Common validation messages
validation.notBlank=must not be blank
validation.notNull=must not be null
validation.notEmpty=must not be empty
validation.size=size must be between {min} and {max}
validation.min=must be greater than or equal to {value}
validation.max=must be less than or equal to {value}
validation.positive=must be a positive number
validation.positiveOrZero=must be zero or a positive number
validation.pattern=must match pattern "{regexp}"
# Chat validation
validation.chat.session.schemaName=schema name is required
validation.chat.message.text=message text is required
validation.chat.correction.type=correction type is required
validation.chat.correction.message=correction message is required
# Import validation
validation.import.tempFileId=temporary file ID is required
validation.import.tempFileId.format=temporary file ID must be a valid UUID format
validation.import.targetSchema=target schema name is required
validation.import.targetSchema.pattern=target schema must contain only alphanumeric characters and underscores
validation.import.chunkSize.min=chunk size must be at least {value}
validation.import.chunkSize.max=chunk size must not exceed {value}
validation.import.listSeparator=list separator is required
validation.import.listSeparator.size=list separator must be between {min} and {max} characters
# Schema override validation
validation.override.attributeName=attribute name is required
validation.override.dataType=data type is required
validation.override.dataType.invalid=invalid data type: must be one of TEXT, INTEGER, BIGINT, DECIMAL, BOOLEAN, DATE, TIME, TIMESTAMP
validation.override.columnName=column name is required
validation.override.separator=separator is required for collection attributes
validation.override.targetRootName=target root name is required for references
validation.override.subAttributeColumns=sub-attribute columns list is required
validation.override.nestedOverrides=nested overrides list is required
# Metamodel validation
validation.metamodel.schemaName=schema name is required
validation.metamodel.rootName=root name is required
# Data/Query validation
validation.query.required=query is required
validation.query.limit.max=query limit must not exceed {value}
# File upload validation
validation.file.required=file is required
validation.file.empty=uploaded file is empty
validation.file.size.max=file size must not exceed {value}
validation.file.type.invalid=invalid file type: only CSV files are supported
