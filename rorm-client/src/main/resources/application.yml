server:
  http2:
    enabled: true
  servlet:
    async:
      timeout: 3600000  # 1 hour for long-lived SSE connections

logging:
  file:
    name: logs/rorm-client.log

spring:
  docker:
    compose:
      enabled: false
  jooq:
    sql-dialect: postgres
  batch:
    jdbc:
      initialize-schema: always
      isolation-level-for-create: read_uncommitted
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5.2-2025-12-11
          temperature: 1.0
  application:
    name: rorm-client
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas:
      - public
  servlet:
    multipart:
      max-file-size: 16GB
      max-request-size: 16GB
  datasource:
    hikari:
      max-lifetime: 18000000  # 5 hours
rorm:
  client:
    temp-file-dir: ${java.io.tmpdir}/rorm-uploads
    temp-file-ttl-hours: 24
    analysis:
      backfill:
        enabled: true
    sse:
      heartbeat-interval-ms: 30000
      reconnect-delay-ms: 3000
  ml:
    startup:
      enabled: true       # false to skip in tests
      timeout: PT15M
      poll-interval: PT3S
  ai:
    throttle:
      enabled: false
      max-tokens-per-minute: 400000
      strategy: UNCACHED_ONLY