server:
  http2:
    enabled: true
  servlet:
    async:
      timeout: 3600000  # 1 hour for long-lived SSE connections

spring:
  jooq:
    sql-dialect: postgres
  batch:
    jdbc:
      initialize-schema: always
      isolation-level-for-create: read_uncommitted
  ai:
    openai:
      api-key: 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
      chat:
        options:
          model: gpt-5.2-2025-12-11
          temperature: 1.0
  application:
    name: rorm-client
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas:
      - public
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 16GB
      max-request-size: 16GB
  datasource:
    hikari:
      max-lifetime: 18000000  # 5 hours

rorm:
  client:
    temp-file-dir: ${java.io.tmpdir}/rorm-uploads
    temp-file-ttl-hours: 24
    sse:
      heartbeat-interval-ms: 30000
      reconnect-delay-ms: 3000
  ml:
    durable-execution: true
    cluster: MlInfraStack-MlCluster87EBA3AE-k1zgJGFRBWkS
    service: MlInfraStack-MlServiceAC8BC53F-R1WsD6iG3HoP
    restateAdminUrl: http://3.75.210.208:9070
    restateEndpointHost: https://dfe7-176-97-63-212.ngrok-free.app
    startup:
      enabled: true       # false to skip in tests
      timeout: PT5M
      poll-interval: PT3S
    service-base-url: http://MlInfr-MlAlb-fsf84yGJ69Ex-1790046904.eu-central-1.elb.amazonaws.com:8000
  ai:
    throttle:
      enabled: true
      max-tokens-per-minute: 400000
      strategy: UNCACHED_ONLY