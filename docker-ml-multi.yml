services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: rorm-valkey-multi
    ports:
      - "6379:6379"
    volumes:
      - valkey-multi-data:/data
    command: valkey-server --appendonly yes
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ml-multi

  minio:
    image: quay.io/minio/minio:latest
    container_name: rorm-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ml-multi

  minio-init:
    image: minio/mc:latest
    container_name: rorm-minio-init
    depends_on:
      - minio
    entrypoint: [ "/bin/sh","-c","until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done; mc mb -p local/rorm-ml-models || true" ]
    networks:
      - ml-multi

  ml-worker-us-east-1:
    build:
      context: rorm-springai/src/main/python
      dockerfile: Dockerfile
    container_name: rorm-ml-worker-us-east-1
    ports:
      - "8001:8000"
    environment:
      AWS_REGION: us-east-1
      STORAGE_BACKEND: s3
      STORAGE_BUCKET_NAME: rorm-ml-models
      STORAGE_AWS_REGION: us-east-1
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      REDIS_URL: redis://valkey:6379
      REDIS_PASSWORD: ""
    depends_on:
      - valkey
      - minio
      - minio-init
    networks:
      - ml-multi

  ml-worker-eu-west-1:
    build:
      context: rorm-springai/src/main/python
      dockerfile: Dockerfile
    container_name: rorm-ml-worker-eu-west-1
    ports:
      - "8002:8000"
    environment:
      AWS_REGION: eu-west-1
      STORAGE_BACKEND: s3
      STORAGE_BUCKET_NAME: rorm-ml-models
      STORAGE_AWS_REGION: us-east-1
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      REDIS_URL: redis://valkey:6379
      REDIS_PASSWORD: ""
    depends_on:
      - valkey
      - minio
      - minio-init
    networks:
      - ml-multi

networks:
  ml-multi:
    driver: bridge

volumes:
  valkey-multi-data:
  minio-data:
